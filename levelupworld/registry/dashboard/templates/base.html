<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}MCP Registry Gateway{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/dashboard.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <strong>Agent-Ops</strong>
      <span>MCP Registry + Policy Gateway</span>
    </div>
    <nav>
      <a href="/" class="{{ 'active' if page=='catalog' else '' }}">Catalog</a>
      <a href="/lab" class="{{ 'active' if page=='lab' else '' }}">Test Lab</a>
      <a href="/ops" class="{{ 'active' if page=='ops' else '' }}">Operations</a>
      <a href="/audit" class="{{ 'active' if page=='audit' else '' }}">Audit</a>
      <a href="/approvals" class="{{ 'active' if page=='approvals' else '' }}">Approvals</a>
      <a href="/admin/quarantine" class="{{ 'active' if page=='quarantine' else '' }}">Quarantine</a>
      <a href="/docs" class="muted">API</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    Control plane catalogs &amp; certifies connectors. Gateway enforces authz, approvals, redaction, budgets, and audit.
  </footer>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
