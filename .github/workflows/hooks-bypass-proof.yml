name: Hooks Bypass Proof

on:
  push:
    branches: [main]
    paths:
      - ".cursor/hooks/**"
      - ".cursor/hooks.json"
      - ".cursor/needs-attention/**"
      - ".cursor/agents/**"
      - "levelupworld/scripts/lib/needs-attention-rails.mjs"
      - "levelupworld/scripts/needs-attention-triage.mjs"
      - "levelupworld/scripts/prove-needs-attention-rails.mjs"
      - "levelupworld/scripts/lib/agent-window-lanes.mjs"
      - "levelupworld/scripts/lib/read-automation-check.mjs"
      - "levelupworld/scripts/check-read-automations.mjs"
      - ".cursor/mcp.json"
      - ".cursor/mcp.pilot.json"
      - ".cursor/mcp.gateway.example.json"
      - "levelupworld/scripts/prove-hooks-fail-closed.mjs"
      - "levelupworld/scripts/check-contract.mjs"
      - ".github/workflows/hooks-bypass-proof.yml"
  pull_request:
    paths:
      - ".cursor/hooks/**"
      - ".cursor/hooks.json"
      - ".cursor/needs-attention/**"
      - ".cursor/agents/**"
      - "levelupworld/scripts/lib/needs-attention-rails.mjs"
      - "levelupworld/scripts/needs-attention-triage.mjs"
      - "levelupworld/scripts/prove-needs-attention-rails.mjs"
      - "levelupworld/scripts/lib/agent-window-lanes.mjs"
      - "levelupworld/scripts/lib/read-automation-check.mjs"
      - "levelupworld/scripts/check-read-automations.mjs"
      - ".cursor/mcp.json"
      - ".cursor/mcp.pilot.json"
      - ".cursor/mcp.gateway.example.json"
      - "levelupworld/scripts/prove-hooks-fail-closed.mjs"
      - "levelupworld/scripts/check-contract.mjs"
      - ".github/workflows/hooks-bypass-proof.yml"
  workflow_dispatch:

jobs:
  prove-fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove hooks fail closed (adversarial cases)
        run: node levelupworld/scripts/prove-hooks-fail-closed.mjs
      - name: Prove Needs Attention subagent rails
        run: node levelupworld/scripts/prove-needs-attention-rails.mjs
      - name: Agent-ops contract checks
        run: node levelupworld/scripts/check-contract.mjs
